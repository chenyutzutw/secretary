<!-- 1. 歷史紀錄區塊調整 -->
<div class="history-section">
  <h3>歷史紀錄</h3>
  <!-- 歷史紀錄列表項目點擊後開啟彈窗 -->
  <ul id="historyList">
    <li onclick="openHistoryModal('2026-09-15 筆記', '這是歷史紀錄的完整內容範例...')">
      2026-09-15 筆記（點擊查看完整內容）
    </li>
  </ul>
</div>

<!-- 歷史紀錄完整內容彈窗 (Modal) -->
<div id="historyModal" class="modal" style="display:none;">
  <div class="modal-content">
    <span class="close-btn" onclick="closeHistoryModal()">&times;</span>
    <h4 id="modalTitle">歷史紀錄詳情</h4>
    <p id="modalBody"></p>
  </div>
</div>

<!-- 2. 下方新增手繪板區塊 -->
<div class="drawing-section" style="margin-top: 20px; border-top: 1px solid #ccc; padding-top: 15px;">
  <h3>手繪板</h3>
  
  <!-- 控制工具列 -->
  <div class="drawing-controls" style="margin-bottom: 10px; display: flex; gap: 10px; align-items: center;">
    <label>筆觸顏色：<input type="color" id="brushColor" value="#000000"></label>
    <label>筆觸大小：<input type="range" id="brushSize" min="1" max="50" value="5"></label>
    <button onclick="clearCanvas()">清空畫布</button>
    <button onclick="saveCanvasImage()">儲存圖片</button>
  </div>

  <!-- 畫布區域 -->
  <canvas id="paintCanvas" width="600" height="400" style="border: 1px solid #000; background-color: #ffffff; cursor: crosshair;"></canvas>
</div>

<script>
// --- 歷史紀錄彈窗邏輯 ---
function openHistoryModal(title, content) {
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalBody').innerText = content;
  document.getElementById('historyModal').style.display = 'block';
}

function closeHistoryModal() {
  document.getElementById('historyModal').style.display = 'none';
}

// --- 手繪板邏輯 ---
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');
const colorPicker = document.getElementById('brushColor');
const sizePicker = document.getElementById('brushSize');

let isDrawing = false;

// 繪圖事件監聽
canvas.addEventListener('mousedown', startDrawing);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDrawing);
canvas.addEventListener('mouseleave', stopDrawing);

function startDrawing(e) {
  isDrawing = true;
  ctx.beginPath();
  ctx.moveTo(e.offsetX, e.offsetY);
}

function draw(e) {
  if (!isDrawing) return;
  ctx.strokeStyle = colorPicker.value;
  ctx.lineWidth = sizePicker.value;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  
  ctx.lineTo(e.offsetX, e.offsetY);
  ctx.stroke();
}

function stopDrawing() {
  isDrawing = false;
  ctx.beginPath();
}

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function saveCanvasImage() {
  const link = document.createElement('a');
  link.download = 'handwriting-note.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>
