<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政主管儀表板</title>
  
  <!-- 1. 修正 Icon 顯示問題：引入最新且穩定的 Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    /* 1. 統一全域字體（繁體中文系統優化） */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif !important;
    }

    body {
      background-color: #f3f4f6;
      color: #1f2937;
      padding: 20px;
    }

    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    /* 標題與主管動態列 */
    .header-bar {
      grid-column: 1 / -1;
      background: #ffffff;
      padding: 16px 24px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e5e7eb;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 右上角主管動態狀態標籤 */
    .leader-status-box {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .status-badge {
      padding: 6px 14px;
      border-radius: 20px;
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    /* 區塊通用樣式 */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #e5e7eb;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 2. 四大 KPI 區域：全面移除陰影 */
    .kpi-grid {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .kpi-card {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      border: 1px solid #e5e7eb;
      /* 無陰影 */
      box-shadow: none !important;
      text-shadow: none !important;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .kpi-icon {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      color: #ffffff;
    }

    .kpi-info .kpi-value {
      font-size: 1.5rem;
      font-weight: bold;
      line-height: 1.2;
    }

    .kpi-info .kpi-label {
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 4px;
    }

    /* 主頁左側內容 */
    .main-left {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 事件列表 (可點擊) */
    .event-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .event-item {
      padding: 12px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer; /* 顯示為可點擊 */
      transition: background-color 0.2s ease;
    }

    .event-item:hover {
      background-color: #f9fafb;
    }

    .event-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .event-time {
      font-size: 0.85rem;
      background: #eff6ff;
      color: #2563eb;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    /* 3. 萬年曆樣式 (箭頭左右) */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .calendar-nav-btn {
      background: none;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #374151;
    }

    .calendar-nav-btn:hover {
      background: #f3f4f6;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 0.875rem;
    }

    .calendar-day-header {
      font-weight: 600;
      color: #6b7280;
      padding: 6px 0;
    }

    .calendar-day {
      padding: 8px 0;
      border-radius: 6px;
      color: #374151;
    }

    .calendar-day.active {
      background: #2563eb;
      color: #ffffff;
      font-weight: bold;
    }

    .calendar-day.muted {
      color: #d1d5db;
    }

    /* 4. 文字備忘錄 */
    .memo-textarea {
      width: 100%;
      height: 140px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
    }

    .memo-textarea:focus {
      border-color: #2563eb;
    }

    /* 事件檢視彈窗 Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      max-width: 450px;
      width: 90%;
    }

    .modal-header {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body p {
      margin-bottom: 8px;
      color: #4b5563;
      line-height: 1.5;
    }

    .modal-close-btn {
      margin-top: 16px;
      padding: 8px 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      float: right;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <!-- Header 區域：含主管動態 -->
    <header class="header-bar">
      <div class="header-title">
        <i class="fa-solid fa-chart-line" style="color: #2563eb;"></i>
        行政管理綜合儀表板
      </div>
      <!-- 右上角主管動態 -->
      <div class="leader-status-box">
        <span><i class="fa-solid fa-user-tie"></i> 主管當前動態：</span>
        <span id="leaderStatusBadge" class="status-badge" style="background-color: #10b981;">載入中...</span>
      </div>
    </header>

    <!-- 2. 四大 KPI (無陰影邊框樣式) -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon" style="background-color: #2563eb;">
          <i class="fa-solid fa-file-signature"></i>
        </div>
        <div class="kpi-info">
          <div class="kpi-value">18 件</div>
          <div class="kpi-label">待簽核公文</div>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon" style="background-color: #10b981;">
          <i class="fa-solid fa-calendar-check"></i>
        </div>
        <div class="kpi-info">
          <div class="kpi-value">5 場</div>
          <div class="kpi-label">今日預定會議</div>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon" style="background-color: #f59e0b;">
          <i class="fa-solid fa-users"></i>
        </div>
        <div class="kpi-info">
          <div class="kpi-value">94 %</div>
          <div class="kpi-label">部門今日出勤率</div>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon" style="background-color: #ef4444;">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div class="kpi-info">
          <div class="kpi-value">2 項</div>
          <div class="kpi-label">列管異常事件</div>
        </div>
      </div>
    </section>

    <!-- 主頁左側：事件列表 -->
    <main class="main-left">
      <div class="card">
        <div class="card-title">
          <i class="fa-solid fa-list-check" style="color: #2563eb;"></i>
          今日與近期重點日程事件（點擊可檢視詳情）
        </div>
        <div class="event-list">
          <div class="event-item" 
               data-title="主管晨報與各組會報" 
               data-time="09:00 - 10:30" 
               data-location="第一會議室" 
               data-desc="檢討本周 KPIs 以及追蹤跨部門公文簽核進度。">
            <div class="event-info">
              <span class="event-time">09:00 - 10:30</span>
              <span>主管晨報與各組會報</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: #9ca3af; font-size: 0.8rem;"></i>
          </div>

          <div class="event-item" 
               data-title="系統資安防護專案審查" 
               data-time="11:00 - 12:00" 
               data-location="線上 Teams 會議" 
               data-desc="審查外部廠商送交之資安弱點掃描報告與修補時程。">
            <div class="event-info">
              <span class="event-time">11:00 - 12:00</span>
              <span>系統資安防護專案審查</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: #9ca3af; font-size: 0.8rem;"></i>
          </div>

          <div class="event-item" 
               data-title="跨部門業務協調會" 
               data-time="14:00 - 16:00" 
               data-location="第二簡報室" 
               data-desc="研商下季度人力預算與設備採購流程優化案。">
            <div class="event-info">
              <span class="event-time">14:00 - 16:00</span>
              <span>跨部門業務協調會</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: #9ca3af; font-size: 0.8rem;"></i>
          </div>
        </div>
      </div>
    </main>

    <!-- 主頁右側：萬年曆與文字備忘錄 -->
    <aside style="display: flex; flex-direction: column; gap: 20px;">
      
      <!-- 3. 萬年曆（箭頭已修改為朝向左右） -->
      <div class="card">
        <div class="calendar-header">
          <!-- 左右箭頭按鈕 -->
          <button class="calendar-nav-btn" id="prevMonth"><i class="fa-solid fa-chevron-left"></i></button>
          <div style="font-weight: bold;" id="calendarMonthTitle">2026 年 9 月</div>
          <button class="calendar-nav-btn" id="nextMonth"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="calendar-grid">
          <div class="calendar-day-header">日</div>
          <div class="calendar-day-header">一</div>
          <div class="calendar-day-header">二</div>
          <div class="calendar-day-header">三</div>
          <div class="calendar-day-header">四</div>
          <div class="calendar-day-header">五</div>
          <div class="calendar-day-header">六</div>
          
          <!-- 日期靜態預覽範例 -->
          <div class="calendar-day muted">30</div>
          <div class="calendar-day">1</div>
          <div class="calendar-day">2</div>
          <div class="calendar-day">3</div>
          <div class="calendar-day">4</div>
          <div class="calendar-day">5</div>
          <div class="calendar-day">6</div>
          <div class="calendar-day">7</div>
          <div class="calendar-day">8</div>
          <div class="calendar-day">9</div>
          <div class="calendar-day">10</div>
          <div class="calendar-day">11</div>
          <div class="calendar-day">12</div>
          <div class="calendar-day active">13</div>
          <div class="calendar-day">14</div>
          <div class="calendar-day">15</div>
          <div class="calendar-day">16</div>
          <div class="calendar-day">17</div>
          <div class="calendar-day">18</div>
          <div class="calendar-day">19</div>
        </div>
      </div>

      <!-- 4. 文字備忘錄：已清除預設提示文字 -->
      <div class="card">
        <div class="card-title">
          <i class="fa-regular fa-note-sticky" style="color: #f59e0b;"></i>
          隨手筆記 / 備忘錄
        </div>
        <textarea class="memo-textarea" placeholder=""></textarea>
      </div>

    </aside>

  </div>

  <!-- 事件檢視彈窗 Modal -->
  <div class="modal-overlay" id="eventModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalTitle">事件名稱</span>
        <i class="fa-solid fa-xmark" style="cursor: pointer; color: #9ca3af;" onclick="closeModal()"></i>
      </div>
      <div class="modal-body">
        <p><strong><i class="fa-regular fa-clock"></i> 時間：</strong><span id="modalTime"></span></p>
        <p><strong><i class="fa-solid fa-location-dot"></i> 地點：</strong><span id="modalLocation"></span></p>
        <p><strong><i class="fa-regular fa-file-lines"></i> 說明：</strong><span id="modalDesc"></span></p>
      </div>
      <button class="modal-close-btn" onclick="closeModal()">關閉</button>
    </div>
  </div>

  <script>
    // 5. 主頁下方事件點擊並檢視詳情
    document.querySelectorAll('.event-item').forEach(item => {
      item.addEventListener('click', function() {
        document.getElementById('modalTitle').innerText = this.dataset.title;
        document.getElementById('modalTime').innerText = this.dataset.time;
        document.getElementById('modalLocation').innerText = this.dataset.location;
        document.getElementById('modalDesc').innerText = this.dataset.desc;
        document.getElementById('eventModal').style.display = 'flex';
      });
    });

    function closeModal() {
      document.getElementById('eventModal').style.display = 'none';
    }

    // 6. 右上角主管動態：根據行事曆日程時間變更狀態
    // 定義主管今天的行事曆日程設定
    const leaderSchedule = [
      { start: "09:00", end: "10:30", status: "主管晨報中", color: "#ef4444" }, // 紅色：會議中
      { start: "11:00", end: "12:00", status: "專案審查中", color: "#f59e0b" }, // 黃色：審查中
      { start: "14:00", end: "16:00", status: "跨部門會報", color: "#3b82f6" }  // 藍色：外會/行程
    ];

    function updateLeaderStatus() {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      let currentStatus = "在席 / 可洽公";
      let statusColor = "#10b981"; // 綠色：空閒在席

      for (const item of leaderSchedule) {
        const [sHour, sMin] = item.start.split(':').map(Number);
        const [eHour, eMin] = item.end.split(':').map(Number);
        const startMinutes = sHour * 60 + sMin;
        const endMinutes = eHour * 60 + eMin;

        if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
          currentStatus = item.status;
          statusColor = item.color;
          break;
        }
      }

      const badge = document.getElementById('leaderStatusBadge');
      if (badge) {
        badge.innerText = currentStatus;
        badge.style.backgroundColor = statusColor;
      }
    }

    // 每 30 秒自動更新一次主管動態
    setInterval(updateLeaderStatus, 30000);
    // 初始化執行一次
    updateLeaderStatus();
  </script>
</body>
</html>
